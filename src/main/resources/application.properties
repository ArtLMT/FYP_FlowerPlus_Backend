spring.application.name=FlowerPlus

# The 'db' in the URL matches the service name in your docker-compose.yml
spring.datasource.url=jdbc:postgresql://localhost:5432/flowerplus
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

# This helps Spring Boot identify the Postgres driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Optional: Helps with debugging Hibernate issues
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update