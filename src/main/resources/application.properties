spring.application.name=FlowerPlus

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:flowerplus}?options=-c%20timezone=UTC
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# Redis Configuration
# Backs the OTP store (short-lived codes with a TTL) and, later, guest carts.
# Lettuce is the default client; no pool settings are needed for a single
# instance, and commons-pool2 is only required if pooling is turned on.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate

# JWT Configuration
# secret-key : 256-bit key encoded in Base64
#              Generate a new one with:  openssl rand -base64 64
# expiration : token lifetime in milliseconds (86400000 = 24 h)
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION}

# OAuth2 Login Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:mock-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:mock-google-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:mock-facebook-client-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:mock-facebook-client-secret}
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

# Frontend Redirect URI for OAuth2 Success
application.security.oauth2.authorized-redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:8080/swagger-ui/index.html}

# Timezone configurations
spring.jackson.time-zone=UTC
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Refresh Token Configuration (default: 7 days = 604800000 ms)
application.security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Email (SMTP) Configuration ? Gmail
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_TLS:true}
application.mail.from=${EMAIL_FROM:${EMAIL_USERNAME}}

# OTP Configuration (registration email verification)
# ttl             : how long a code stays valid
# max-attempts    : guesses allowed against one code before it is destroyed
# resend-interval : minimum gap between sends to the same address
application.security.otp.ttl=${OTP_TTL:5m}
application.security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
application.security.otp.resend-interval=${OTP_RESEND_INTERVAL:60s}
