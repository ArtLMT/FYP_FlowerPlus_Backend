# Test classpath only. Spring Boot loads classpath:/config/ after the classpath
# root, so this adds to src/main/resources/application.properties rather than
# replacing it. It reaches every test without editing one, including the
# frozen AuthRegressionTest (ADR 0003).
spring.profiles.active=dev

# AuthRegressionTest declares no admin values of its own, and a fresh schema has
# no admin, so without these the app would refuse to start under that test.
ADMIN_EMAIL=admin@flowerplus.test
ADMIN_PASSWORD=AdminPassword123
